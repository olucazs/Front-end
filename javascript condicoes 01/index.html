<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
</head>
<body>
    <h1>Sistema de multas</h1>
    Velocidade do carro <input type="number" id="txtvel">km/h
    <input type="button" value="verificar" id="verify" onclick="calcular()">

    <div id="res"></div>

    <script>

        function calcular(){
            var txtv = document.getElementById("txtvel")
            var res = document.querySelector("div#res")
            var vel = Number(txtv.value)
            res.innerHTML = `Sua velocidade era de <strong>${vel}km/h </strong>`

            if(vel > 60){
                res.innerHTML += '<p>Você está <strong>multado<strong> por excesso de velocidade!</p>'
            }

            else{
                res.innerHTML += '<p>Você não foi multado pois estava dentro do limite da via!</p>'
            }

            res.innerHTML += '<p>Diriga sempre com cinto de segurança!</p>'
        }
    </script>
</body>
</html>
