<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <table>
            <thead>
                <th>Nome</th>
                <th>Idade</th>
                <th>Profissão</th>
            </thead>
            <tr>
                <td>Lucas</td>
                <td>20</td>
                <td>Programador</td>
            </tr>
            <tr>
                <td>Gustavo</td>
                <td>41</td>
                <td rowspan="2">Professor</td>
            </tr>
            <tr>
                <td>Guilherme</td>
                <td>35</td>
                
            </tr>
        </table>
    </div>
</body>
</html>
