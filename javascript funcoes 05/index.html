<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS funções</title>
</head>
<body>
    <h1 id="title">That's my title</h1>
    <button onclick="myFunction()">Click here to change the title</button>
</body>

<script>
    function myFunction(){
        document.getElementById('title').innerHTML = 'I might be another title';
    }
</script>
</html>
