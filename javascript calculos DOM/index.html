<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculos DOM</title>

    <style>
        div{margin-top: 20px;}
        button{padding: 10px 20px; border-radius: 15px; border: 1px solid black; cursor: pointer;}
        input{padding: 5px 10px; border-radius: 10px; border: 1px solid black;}
    </style>
</head>
<body>
    <h1>Somando números</h1>

    <input type="number" placeholder="Número..." id="num1">
    <span>+</span>
    <input type="number" placeholder="Número..." id="num2">
    <span>=</span>
    <span id="showRes"></span>

    <div>
    <button id="botao" onclick="somar()">SOMAR</button>
    </div>
</body>

<script>

    function somar(){
        let num1 = document.getElementById('num1').value
        let num2 = document.getElementById('num2').value
        let res = Number(num1) + Number(num2)
        let showRes = document.getElementById('showRes')

        showRes.innerHTML = res
    }

</script>
</html>
