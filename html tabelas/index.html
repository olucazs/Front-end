<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas e formulários</title>
    <style>
        table{
            align-items: center;
            text-align: center;
            margin-bottom:40px;
        }
        td{
            border-style: solid;
            margin: 0;
        }
    </style>
</head>
<body>
    <table width="900px">
        <thead>
            <tr>
                <th>Nome</th>
                <th>Idade</th>
                <th>Profissão</th>
            </tr>
        </thead>
        <tr>
            <td>Lucas</td>
            <td>20</td>
            <td>Web Developer</td>
        </tr>
        <tr>
            <td>Gustavo</td>
            <td>36</td>
            <td>Professor</td>
        </tr>
        <tr>
            <td>Guilherme</td>
            <td>28</td>
            <td>Programador Senior</td>
        </tr>
    </table>

    <form>
        Nome <input type="text"><br>
        Senha <input type="password"><br>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </form>
</body>
</html>
