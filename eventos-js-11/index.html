<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos</title>
</head>
<body>
    <h1>javaScript</h1>

    <h2>Tentando ralizar somas:</h2>

    <input type="number" id="numero">

    <input type="number" id="numero2">

    <button type="button" id="showcalc" onclick="soma()">Mostrar calculo!</button>

    <p id="result">=</p>

    <script>
        function soma(){
            var n1 = Number(document.getElementById("numero").value);

            var n2 = Number( document.getElementById("numero2").value);

            var s = n1 + n2;

            document.getElementById("result").innerHTML = `= ${s}`
        }
    </script>
</body>
</html>
